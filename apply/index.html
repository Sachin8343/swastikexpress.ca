<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independent Contractor Driver Application – Swastik Express</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #F1F5F9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #app-frame {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    border: none; display: block;
  }
  #fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #F1F5F9; color: #666; font-size: 14px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<div id="fallback">Loading the application form…</div>
<iframe id="app-frame" title="Independent Contractor Driver Application"
        src="https://portal.swastikexpress.ca/apply"
        onload="document.getElementById('fallback').style.display='none';">
</iframe>
</body>
</html>
